<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essential Links – Glass Edition</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=stylesheet"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tab icon -->
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/13984/13984466.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Script.js -->
    <script src="script.js" defer></script>



    <!-- stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        stone: { 50: '#fafaf9', 100: '#f5f5f4', 900: '#1c1917' },
                        violet: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
                    },
                    animation: {
                        'float-slow': 'floatSlow 8s ease-in-out infinite',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'gradient-x': 'gradientX 3s ease infinite',
                    },
                    keyframes: {
                        floatSlow: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        gradientX: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>

</head>

<body class="antialiased selection:bg-violet-500 selection:text-white transition-colors duration-500 overflow-x-hidden">

    <!-- Background Lights -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="ambient-light light-1 animate-float-slow"></div>
        <div class="ambient-light light-2 animate-float-slow" style="animation-delay: -4s;"></div>
    </div>

    <!-- Loader Overlay -->
    <div id="loadingPopup"
        class="fixed inset-0 z-[100] bg-white/40 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader" style="--size: 0.8;">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <defs>
                    <mask id="clipping">
                        <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
                        <polygon points="25,25 75,25 50,75" fill="white"></polygon>
                        <polygon points="50,25 75,75 25,75" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                    </mask>
                </defs>
            </svg>
            <div class="box"></div>
        </div>
        <p class="text-gray-700 font-medium mt-4 text-xs tracking-wide uppercase">Loading Dashboard</p>
    </div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-40 glass
transition-all duration-300
border-b-0 h-16
shadow-[0_8px_30px_rgba(0,0,0,0.06)]
dark:shadow-[0_8px_30px_rgba(0,0,0,0.35)]
">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between gap-4">

            <!-- Logo -->
            <div class="flex items-center gap-2.5 cursor-pointer group shrink-0">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-indigo-600 text-white flex items-center justify-center shadow-md group-hover:shadow-violet-500/30 transition-all duration-300">
                    <i class="fa-solid fa-layer-group text-sm"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-lg font-bold tracking-tight text-stone-900 dark:text-white leading-none">
                        Essential<span class="font-light text-violet-600 dark:text-violet-400">Links</span></h1>
                </div>
            </div>

            <!-- Animated Search Bar -->
            <div class="relative w-full max-w-[200px] lg:max-w-xs group flex-1 max-w-md mx-4">
                <div
                    class="relative rounded-full overflow-hidden animate-border-glow transition-all duration-300 h-9">
                    <div
                        class="absolute inset-0 bg-gradient-to-r from-transparent via-transparent to-transparent animate-gradient-flow opacity-20">
                    </div>
                    <div class="absolute inset-0 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm"></div>
                    <div class="relative z-10 flex items-center px-2.5 h-full">
                        <i
                            class="fa-solid fa-search text-gray-400 dark:text-gray-500 text-xs animate-icon-glow mr-2"></i>
                        <input type="text" id="searchInput"
                            class="w-full bg-transparent text-gray-800 dark:text-white placeholder-gray-500 border-none focus:outline-none text-sm transition-all duration-300 h-full"
                            placeholder="Search links...">
                        <button id="clearSearch" class="hidden text-gray-400 hover:text-red-400 transition-colors">
                            <i class="fa-solid fa-times-circle text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0 justify-end">
                <!-- Filter Dropdown -->
                <div class="relative z-50 shrink-0" id="dropdownWrapper">
                    <button onclick="toggleDropdown()"
                        class="flex items-center dark:bg-[#2a3444] bg-violet-50 gap-2 px-3 py-1.5 rounded-full glass hover:bg-white/80 dark:hover:bg-slate-700/50 transition-all text-stone-700 dark:text-stone-200 text-xs font-semibold shadow-sm">
                        <span id="currentFilter" class="truncate max-w-[60px]">All</span>
                        <i class="fa-solid fa-chevron-down text-[10px] opacity-60 transition-transform"
                            id="chevron"></i>
                    </button>

                    <!-- Glass Dropdown (Smooth Animation) -->
                    <div id="dropdownMenu" <div
                        class="absolute right-0 mt-2 w-40 glass-dropdown-menu rounded-xl overflow-hidden hidden dropdown-hidden">
                        <div class="py-1 max-h-64 overflow-y-auto">
                            <button onclick="setFilter('')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors flex items-center justify-between group">
                                All
                                <i
                                    class="fa-solid fa-layer-group text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            </button>
                            <button onclick="setFilter('AI')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">AI</button>
                            <button onclick="setFilter('Cloud')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Cloud</button>
                            <button onclick="setFilter('Community')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Community</button>
                            <button onclick="setFilter('Courses')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Courses</button>
                            <button onclick="setFilter('Design')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Design</button>
                            <button onclick="setFilter('Dev')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Dev</button>
                            <button onclick="setFilter('Education')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Education</button>
                            <button onclick="setFilter('Hosting')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Hosting</button>
                            <button onclick="setFilter('Inspiration')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Inspiration</button>
                            <button onclick="setFilter('Resources')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Resources</button>
                            <button onclick="setFilter('SEO')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">SEO</button>
                            <button onclick="setFilter('Services')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Services</button>
                            <button onclick="setFilter('Templates')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Templates</button>
                            <button onclick="setFilter('Tools')"
                                class="w-full text-left px-4 py-2 text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-violet-50 dark:hover:bg-violet-900/20 hover:text-violet-600 dark:hover:text-violet-300 transition-colors">Tools</button>
                        </div>
                    </div>
                </div>

                <!-- Edit Mode Toggle -->
                <div
                    class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-full glass hover:bg-white/80 dark:hover:bg-slate-700/50 transition-colors shrink-0">
                    <span
                        class="text-[10px] font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wide">Edit</span>
                    <label class="toggle-switch"><input type="checkbox" id="editToggle"><span
                            class="toggle-slider"></span></label>
                </div>

                <button onclick="document.getElementById('editToggle').click()"
                    class="sm:hidden w-8 h-8 flex items-center justify-center rounded-full glass text-stone-500 dark:text-stone-400">
                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                </button>

                <!-- Refresh -->
                <button onclick="refreshData()"
                    class="w-8 h-8 bg-violet-50 dark:bg-[#2a3444] rounded-full flex items-center justify-center text-stone-500 dark:text-slate-400 hover:bg-stone-200 dark:hover:bg-slate-700/50 transition-colors shrink-0">
                    <i class="fa-solid fa-rotate-right text-[10px] transition-transform duration-500"
                        id="refreshIcon"></i>
                </button>

                <div class="h-4 w-px bg-stone-300 dark:bg-slate-700 mx-1 shrink-0"></div>

                <button onclick="toggleTheme()"
                    class="w-8 h-8 bg-violet-50 dark:bg-[#2a3444] rounded-full flex items-center justify-center text-stone-500 dark:text-slate-400 hover:bg-stone-200 dark:hover:bg-slate-700/50 transition-colors shrink-0">
                    <i class="fa-regular fa-sun text-xs dark:hidden"></i>
                    <i class="fa-regular fa-moon text-xs hidden dark:block"></i>
                </button>

                <button onclick="openModal()"
                    class="bg-stone-900 dark:bg-[#2a3444] text-white dark:text-white-900 px-4 py-1.5 rounded-full text-xs font-bold shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-plus text-[10px]"></i> <span class="hidden sm:inline">Add</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-10 min-h-screen" id="mainContainer">
        <!-- Content injected via JS -->
    </main>

    <!-- Empty State -->
    <div id="emptyState" class="hidden fixed inset-0 z-30 flex items-center justify-center pointer-events-none pt-10">
        <div
            class="glass-card p-8 rounded-2xl text-center max-w-sm mx-4 animate-slide-up shadow-2xl pointer-events-auto">
            <div
                class="w-14 h-14 rounded-full bg-violet-50 dark:bg-slate-800 flex items-center justify-center mb-4 mx-auto">
                <i class="fa-solid fa-magnifying-glass text-2xl text-violet-300 dark:text-slate-600"></i>
            </div>
            <h3 class="text-xl font-bold text-stone-900 dark:text-white mb-1">No results</h3>
            <p class="text-stone-500 dark:text-slate-400 text-sm mb-4">Try adjusting search or filters.</p>
            <button onclick="resetFilters()"
                class="px-4 py-2 rounded-lg bg-violet-100 dark:bg-violet-900/30 text-violet-600 dark:text-violet-300 text-xs font-bold hover:bg-violet-200 dark:hover:bg-violet-900/50 transition-colors">Reset
                Filters</button>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Add Link Modal -->
    <div id="modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-stone-900/20 dark:bg-black/40 backdrop-blur-sm transition-opacity opacity-0"
            id="modalBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass bg-white w-full max-w-sm rounded-2xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300 overflow-hidden"
                id="modalContent">
                <div class="p-5">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg font-bold text-stone-900 dark:text-white">Add Resource</h2>
                        <button onclick="closeModal()"
                            class="text-stone-400 hover:text-stone-600 dark:hover:text-white transition-colors w-6 h-6 flex items-center justify-center rounded-full hover:bg-stone-100 dark:hover:bg-slate-700"><i
                                class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                    <form id="addForm" class="space-y-4">
                        <div>
                            <label
                                class="block text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400 mb-1.5">URL</label>
                            <input type="url" id="urlInput" required
                                class="w-full px-3 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white placeholder-stone-400"
                                placeholder="https://example.com">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label
                                    class="block text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400 mb-1.5">Group</label>
                                <div class="relative">
                                    <select id="groupInput"
                                        class="w-full px-3 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white appearance-none cursor-pointer">
                                        <option value="Design">Design</option>
                                        <option value="Dev">Dev</option>
                                        <option value="Tools">Tools</option>
                                        <option value="Inspiration">Inspiration</option>
                                    </select>
                                    <i
                                        class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-stone-400 pointer-events-none"></i>
                                </div>
                            </div>
                            <div>
                                <label
                                    class="block text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400 mb-1.5">Tags</label>
                                <input type="text" id="tagsInput"
                                    class="w-full px-3 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white placeholder-stone-400"
                                    placeholder="ui, css">
                            </div>
                        </div>
                        <div class="pt-3 flex gap-2">
                            <button type="button" onclick="closeModal()"
                                class="flex-1 py-2 rounded-lg font-medium text-stone-500 hover:bg-stone-100 dark:hover:bg-slate-700 transition-colors text-xs">Cancel</button>
                            <button type="submit"
                                class="flex-1 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-lg hover:shadow-violet-500/30 transform active:scale-95 transition-all text-xs">Save
                                Link</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Link Modal -->
    <div id="editModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-stone-900/20 dark:bg-black/40 backdrop-blur-sm transition-opacity opacity-0"
            id="editModalBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass w-full max-w-sm rounded-2xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300 overflow-hidden"
                id="editModalContent">
                <div class="p-5">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg font-bold text-stone-900 dark:text-white">Edit Resource</h2>
                        <button onclick="closeEditModal()"
                            class="text-stone-400 hover:text-stone-600 dark:hover:text-white transition-colors w-6 h-6 flex items-center justify-center rounded-full hover:bg-stone-100 dark:hover:bg-slate-700"><i
                                class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                    <form id="editForm" class="space-y-4">
                        <div>
                            <label
                                class="block text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400 mb-1.5">URL</label>
                            <input type="url" id="editUrlInput" required
                                class="w-full px-3 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white placeholder-stone-400">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label
                                    class="block text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400 mb-1.5">Group</label>
                                <div class="relative">
                                    <select id="editGroupInput"
                                        class="w-full px-3 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white appearance-none cursor-pointer">
                                        <option value="Design">Design</option>
                                        <option value="Dev">Dev</option>
                                        <option value="Tools">Tools</option>
                                        <option value="Inspiration">Inspiration</option>
                                    </select>
                                    <i
                                        class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-stone-400 pointer-events-none"></i>
                                </div>
                            </div>
                            <div>
                                <label
                                    class="block text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400 mb-1.5">Tags</label>
                                <input type="text" id="editTagsInput"
                                    class="w-full px-3 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white placeholder-stone-400">
                            </div>
                        </div>
                        <div class="pt-3 flex gap-2">
                            <button type="button" onclick="closeEditModal()"
                                class="flex-1 py-2 rounded-lg font-medium text-stone-500 hover:bg-stone-100 dark:hover:bg-slate-700 transition-colors text-xs">Cancel</button>
                            <button type="submit"
                                class="flex-1 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white font-bold shadow-lg hover:shadow-violet-500/30 transform active:scale-95 transition-all text-xs">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-stone-900/20 dark:bg-black/50 backdrop-blur-sm transition-opacity opacity-0"
            id="deleteModalBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass bg-white w-full max-w-xs rounded-2xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300 overflow-hidden text-center p-6"
                id="deleteModalContent">
                <div
                    class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-900/20 text-red-500 flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <h3 class="text-lg font-bold text-stone-900 dark:text-white mb-1">Delete Link?</h3>
                <p class="text-stone-500 dark:text-slate-400 text-sm mb-5">This action cannot be undone.</p>
                <div class="flex gap-2 justify-center">
                    <button onclick="closeDeleteModal()"
                        class="px-4 py-2 rounded-lg bg-stone-100 dark:bg-slate-700 text-stone-600 dark:text-slate-200 text-xs font-bold hover:bg-stone-200 dark:hover:bg-slate-600 transition-colors">Cancel</button>
                    <button onclick="confirmDelete()"
                        class="px-4 py-2 rounded-lg bg-red-500 text-white text-xs font-bold shadow-lg hover:bg-red-600 hover:shadow-red-500/30 transform active:scale-95 transition-all">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Login Modal (NEW FEATURE) -->
    <div id="loginModal" class="fixed inset-0 z-[80] hidden">
        <div class="absolute inset-0 bg-stone-900/40 dark:bg-black/60 backdrop-blur-sm transition-opacity opacity-0"
            id="loginModalBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass bg-white w-full max-w-xs rounded-2xl shadow-2xl transform scale-95 opacity-0 transition-all duration-300 overflow-hidden text-center p-6"
                id="loginModalContent">
                <div
                    class="w-12 h-12 rounded-full bg-violet-50 dark:bg-violet-900/20 text-violet-600 dark:text-violet-400 flex items-center justify-center mx-auto mb-4 animate-bounce">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <h3 class="text-lg font-bold text-stone-900 dark:text-white mb-1">Admin Access</h3>
                <p class="text-stone-500 dark:text-slate-400 text-xs mb-5">Enter ID and Password to edit links.</p>

                <form id="loginForm" class="space-y-3 text-left">
                    <div>
                        <label for="loginId"
                            class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-slate-500 ml-1">ID</label>
                        <input type="text" id="loginId" name="loginId" placeholder="admin" autocomplete="username"
                            class="w-full px-4 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white">
                    </div>
                    <div>
                        <label for="loginPass"
                            class="text-[10px] font-bold uppercase tracking-wider text-stone-400 dark:text-slate-500 ml-1">Password</label>
                        <input type="password" id="loginPass" name="loginPass" placeholder="1234"
                            autocomplete="current-password"
                            class="w-full px-4 py-2 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-stone-200 dark:border-slate-700 focus:ring-2 focus:ring-violet-500/20 outline-none transition-all text-sm text-stone-900 dark:text-white">
                    </div>
                    <button type="submit"
                        class="w-full py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-xs font-bold shadow-lg hover:shadow-violet-500/30 transform active:scale-95 transition-all mt-2">Unlock</button>
                </form>
                <button onclick="closeLoginModal()"
                    class="mt-4 w-full text-xs font-medium text-stone-500 hover:text-stone-700 dark:hover:text-stone-300 transition-colors">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Floating Scroll Indicator -->
    <!-- Floating Glass Scroll Progress Button -->
    <button id="scrollProgressBtn"
        class="fixed bottom-6 right-6 w-14 h-14 rounded-full glass shadow-2xl backdrop-blur-lg border border-white/30 dark:border-white/10 flex items-center justify-center z-50 transition-all duration-500 transform translate-y-20 opacity-0 group">

        <!-- Circular Progress Background -->
        <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
            <!-- Background circle -->
            <circle cx="50" cy="50" r="45" fill="transparent" stroke="rgba(255, 255, 255, 0.2)" stroke-width="5"
                class="dark:stroke-slate-700/50" />

            <!-- Progress circle -->
            <circle id="scrollProgressCircle" cx="50" cy="50" r="45" fill="transparent" stroke="url(#gradient)"
                stroke-width="5" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283" />

            <!-- Gradient definition -->
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="100%" stop-color="#6366f1" />
                </linearGradient>
            </defs>
        </svg>

        <!-- Icon -->
        <i
            class="fa-solid fa-arrow-up text-lg text-violet-600 dark:text-violet-300 group-hover:scale-110 transition-transform duration-300 relative z-10"></i>

        <!-- Tooltip -->
        <div
            class="absolute bottom-full mb-3 px-3 py-2 rounded-lg bg-white/90 dark:bg-slate-800/90 backdrop-blur-md text-xs font-medium text-stone-800 dark:text-white whitespace-nowrap opacity-0 group-hover:opacity-100 transition-all duration-300 transform -translate-y-2 group-hover:translate-y-0 pointer-events-none">
            Scroll to top
            <div class="absolute top-full left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 dark:bg-slate-800/90 rotate-45">
            </div>
        </div>
    </button>


    <style>
        /* Progress Circle Animation */
        #scrollProgressCircle {
            transition: stroke-dashoffset 0.1s ease-out;
        }

        /* Glass Button Animation */
        #scrollProgressBtn.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #scrollProgressBtn:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        /* Make sure your original body styles are preserved */
        body {
            overflow-y: auto !important;
            /* Keep original scrolling */
            height: auto !important;
        }

        /* Smooth scrolling for the entire page */
        html {
            scroll-behavior: smooth;
        }
    </style>
    <script>
        // --- Simple Scroll Progress with Smooth Scroll ---
        function initScrollProgress() {
            const scrollBtn = document.getElementById('scrollProgressBtn');
            const progressCircle = document.getElementById('scrollProgressCircle');

            if (!scrollBtn || !progressCircle) return;

            // Update scroll progress
            function updateScrollProgress() {
                const windowHeight = document.documentElement.scrollHeight - window.innerHeight;
                const scrolled = (window.scrollY / windowHeight) * 100;

                // Update circle progress (283 = 2 * π * 45)
                const circumference = 283;
                const offset = circumference - (scrolled * circumference / 100);
                progressCircle.style.strokeDashoffset = offset;

                // Show/hide button
                if (window.scrollY > 300) {
                    scrollBtn.classList.add('show');
                } else {
                    scrollBtn.classList.remove('show');
                }
            }

            // Scroll to top button
            scrollBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

                // Add bounce effect
                scrollBtn.style.transform = 'scale(0.9) rotate(-10deg)';
                setTimeout(() => {
                    scrollBtn.style.transform = '';
                }, 200);
            });

            // Listen for scroll
            window.addEventListener('scroll', updateScrollProgress);

            // Initialize
            updateScrollProgress();
        }

        // Initialize when page loads
        window.addEventListener('load', () => {
            initScrollProgress();
        });

        // Enhanced smooth scrolling for the entire page
        function enhanceSmoothScroll() {
            // Add smooth scroll to all anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href === '#') return;

                    const targetElement = document.querySelector(href);
                    if (targetElement) {
                        e.preventDefault();
                        targetElement.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });

            // Add smooth momentum to wheel scrolling
            let isScrolling = false;
            let scrollTimeout;

            window.addEventListener('wheel', () => {
                if (!isScrolling) {
                    document.body.style.scrollBehavior = 'auto';
                    isScrolling = true;
                }

                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    document.body.style.scrollBehavior = 'smooth';
                    isScrolling = false;
                }, 100);
            }, { passive: true });
        }

        // Initialize enhanced scrolling
        window.addEventListener('load', enhanceSmoothScroll);
    </script>
</body>

</html>
